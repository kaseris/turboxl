name: Create release tag

on:
  push:
    branches: [main]
    paths:
      - CMakeLists.txt
  workflow_dispatch:

concurrency:
  group: create-release-tag
  cancel-in-progress: false

# The tag push made with GITHUB_TOKEN does not start another workflow, so this
# workflow explicitly dispatches release.yml after creating the tag.
permissions:
  actions: write
  contents: write

jobs:
  tag:
    name: Tag CMake project version
    runs-on: ubuntu-latest
    steps:
      - name: Check out source and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read project version
        id: version
        shell: bash
        run: |
          version="$(sed -nE 's/^project\(turboxl VERSION ([0-9]+\.[0-9]+\.[0-9]+) LANGUAGES CXX\)$/\1/p' CMakeLists.txt)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=CMakeLists.txt::Could not read one semantic version from the turboxl project() declaration"
            exit 1
          fi

          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          if git show-ref --verify --quiet "refs/tags/$tag"; then
            echo "Tag $tag already exists; there is nothing to release."
            echo "create=false" >> "$GITHUB_OUTPUT"
          else
            echo "create=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push tag
        if: steps.version.outputs.create == 'true'
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$GITHUB_SHA" -m "Release $TAG"
          git push origin "refs/tags/$TAG"

      - name: Start release workflow
        if: steps.version.outputs.create == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh workflow run release.yml --ref "$TAG"
