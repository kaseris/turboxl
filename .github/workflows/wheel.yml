name: Distributions
on:
  workflow_call:
permissions:
  contents: read
jobs:
  sdist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -c tools/ci/constraints.txt build scikit-build-core nanobind twine
      - run: python -m build --sdist --no-isolation
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30
  wheels:
    needs: sdist
    name: Wheels / ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
            arch: x86_64
          - platform: windows-x64
            runner: windows-2022
            arch: AMD64
          - platform: macos-arm64
            runner: macos-15
            arch: arm64
          - platform: macos-x64
            runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sdist
          path: sdist
      - name: Unpack source archive without Git metadata
        shell: bash
        run: |
          mkdir source
          tar -xzf sdist/*.tar.gz -C source --strip-components=1
      - uses: ./.github/actions/setup-build
        with:
          linux-container: 'true'
      - name: Configure isolated build constraints
        shell: bash
        run: python tools/ci/wheel_environment.py
      - name: Build, repair, and test all supported interpreters
        uses: pypa/cibuildwheel@294735312765b09d24a2fbec22660ce817587d55 # v4.1.0
        with:
          package-dir: source
          config-file: source/pyproject.toml
          extras: uv
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_CACHE_PATH: ${{ runner.temp }}/cibuildwheel-cache
          CIBW_BUILD_VERBOSITY: '1'
          PIP_CONSTRAINT: ${{ github.workspace }}/tools/ci/constraints.txt
      - name: Validate wheel inventory and stable ABI
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          python -m pip install -c tools/ci/constraints.txt packaging twine abi3audit
          python tools/ci/validate_dist.py wheelhouse --platform "$PLATFORM"
          python -m twine check --strict wheelhouse/*.whl
          python -m abi3audit --strict wheelhouse/*-abi3-*.whl
      - name: Compiler cache statistics
        if: always() && runner.os != 'Windows'
        shell: bash
        run: |
          if command -v ccache >/dev/null; then
            ccache --show-stats | tee -a "$GITHUB_STEP_SUMMARY"
          else
            cat /tmp/turboxl-ccache/dependencies.txt /tmp/turboxl-ccache/statistics.txt >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheels-${{ matrix.platform }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 30
  validate:
    needs: [sdist, wheels]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sdist
          path: dist
      - run: python -m pip install -c tools/ci/constraints.txt packaging twine
      - run: python tools/ci/validate_dist.py dist
      - run: python -m twine check --strict dist/*.whl dist/*.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 30
