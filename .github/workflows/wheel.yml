name: Distributions
on:
  workflow_call:
permissions:
  contents: read
jobs:
  sdist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -c tools/ci/constraints.txt build scikit-build-core nanobind twine
      - run: python -m build --sdist --no-isolation
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30
  wheels:
    needs: sdist
    name: Wheels / ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
            arch: x86_64
          - platform: windows-x64
            runner: windows-2022
            arch: AMD64
          - platform: macos-arm64
            runner: macos-15
            arch: arm64
          - platform: macos-x64
            runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdist
          path: sdist
      - name: Unpack source archive without Git metadata
        shell: bash
        run: |
          mkdir source
          tar -xzf sdist/*.tar.gz -C source --strip-components=1
      - uses: ./.github/actions/setup-build
        with:
          linux-container: 'true'
      - name: Configure isolated build constraints
        shell: bash
        run: python tools/ci/wheel_environment.py
      - name: Build, repair, and test all supported interpreters
        uses: pypa/cibuildwheel@e090b81e30c4d855ea63bf4b6e59204c09a101ae # v4.2.1
        with:
          package-dir: source
          config-file: source/pyproject.toml
          extras: uv
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_CACHE_PATH: ${{ runner.temp }}/cibuildwheel-cache
          CIBW_BUILD_VERBOSITY: '1'
          PIP_CONSTRAINT: ${{ github.workspace }}/tools/ci/constraints.txt
      - name: Validate wheel inventory and stable ABI
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          python -m pip install -c tools/ci/constraints.txt packaging twine abi3audit
          python tools/ci/validate_dist.py wheelhouse --platform "$PLATFORM"
          python -m twine check --strict wheelhouse/*.whl
          python -m abi3audit --strict wheelhouse/*-abi3-*.whl
      - name: Compiler cache statistics
        if: always() && runner.os != 'Windows'
        shell: bash
        run: |
          if command -v ccache >/dev/null; then
            ccache --show-stats | tee -a "$GITHUB_STEP_SUMMARY"
          else
            cat /tmp/turboxl-ccache/dependencies.txt /tmp/turboxl-ccache/statistics.txt >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-${{ matrix.platform }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 30
  validate:
    needs: [sdist, wheels]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdist
          path: dist
      - run: python -m pip install -c tools/ci/constraints.txt packaging twine
      - run: python tools/ci/validate_dist.py dist
      - run: python -m twine check --strict dist/*.whl dist/*.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 30
  performance:
    needs: wheels
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wheels-windows-x64
          path: wheelhouse
      - name: Install benchmark engines
        shell: bash
        run: python -m pip install -c tools/ci/constraints.txt python-calamine wheelhouse/*cp312-abi3-win_amd64.whl
      - name: Generate deterministic inline-string benchmark
        run: python tools/generate_benchmark_fixture.py benchmark-inline.xlsx --rows 60000 --mode inline
      - name: Require TurboXL to beat calamine CSV serialization
        shell: bash
        run: >-
          python tools/benchmark_parity.py benchmark-inline.xlsx
          --python "$(command -v python)" --warmups 2 --rounds 9
          --include-file-output --profile-turboxl
          --json-output performance-results.json
          --require-turboxl-not-slower
      - name: Check public typed workbook parity
        shell: bash
        run: |
          python tools/benchmark_typed.py --rows 60000 --warmups 2 --rounds 9 \
            --turboxl-mode workbook-path --json-output typed-workbook-path-results.json
          python tools/benchmark_typed.py --rows 60000 --warmups 2 --rounds 9 \
            --turboxl-mode workbook-bytesio --json-output typed-workbook-bytesio-results.json
      - name: Publish performance summary
        if: always()
        shell: bash
        run: |
          if [[ -f performance-results.json ]]; then
            cat performance-results.json >> "$GITHUB_STEP_SUMMARY"
          fi
          for report in typed-workbook-*-results.json; do
            [[ -f "$report" ]] && cat "$report" >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: performance-results-windows-x64
          path: |
            performance-results.json
            typed-workbook-*-results.json
          if-no-files-found: warn
          retention-days: 30
