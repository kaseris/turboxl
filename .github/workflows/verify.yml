name: Verify wheels

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "**.rst"
      - "docs/**"
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "**.rst"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  wheels:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-24.04
            arch: x86_64
            build: cp312-manylinux_x86_64
            bits: 64
            artifact: verify-linux-x86_64
            vcpkg-triplet: ""
          - name: Windows x64
            runner: windows-2022
            arch: AMD64
            build: cp312-win_amd64
            bits: 64
            artifact: verify-windows-x64
            vcpkg-triplet: x64-windows-static-md
          - name: Windows x86
            runner: windows-2022
            arch: x86
            build: cp312-win32
            bits: 32
            artifact: verify-windows-x86
            vcpkg-triplet: x86-windows-static-md
          - name: macOS arm64
            runner: macos-15
            arch: arm64
            build: cp312-macosx_arm64
            bits: 64
            artifact: verify-macos-arm64
            vcpkg-triplet: ""
          - name: macOS x86_64
            runner: macos-15-intel
            arch: x86_64
            build: cp312-macosx_x86_64
            bits: 64
            artifact: verify-macos-x86_64
            vcpkg-triplet: ""
    uses: ./.github/workflows/wheel.yml
    with:
      runner: ${{ matrix.runner }}
      arch: ${{ matrix.arch }}
      build: ${{ matrix.build }}
      expected-bits: ${{ matrix.bits }}
      artifact-name: ${{ matrix.artifact }}
      vcpkg-triplet: ${{ matrix.vcpkg-triplet }}
