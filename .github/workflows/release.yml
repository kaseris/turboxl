name: Release wheels

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  wheels:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-24.04
            arch: x86_64
            build: "cp310-manylinux_x86_64 cp311-manylinux_x86_64 cp312-manylinux_x86_64"
            bits: 64
            artifact: wheels-linux-x86_64
            vcpkg-triplet: ""
          - name: Windows x64
            runner: windows-2022
            arch: AMD64
            build: "cp310-win_amd64 cp311-win_amd64 cp312-win_amd64"
            bits: 64
            artifact: wheels-windows-x64
            vcpkg-triplet: x64-windows-static-md
          - name: Windows x86
            runner: windows-2022
            arch: x86
            build: "cp310-win32 cp311-win32 cp312-win32"
            bits: 32
            artifact: wheels-windows-x86
            vcpkg-triplet: x86-windows-static-md
          - name: macOS arm64
            runner: macos-15
            arch: arm64
            build: "cp310-macosx_arm64 cp311-macosx_arm64 cp312-macosx_arm64"
            bits: 64
            artifact: wheels-macos-arm64
            vcpkg-triplet: ""
          - name: macOS x86_64
            runner: macos-15-intel
            arch: x86_64
            build: "cp310-macosx_x86_64 cp311-macosx_x86_64 cp312-macosx_x86_64"
            bits: 64
            artifact: wheels-macos-x86_64
            vcpkg-triplet: ""
    uses: ./.github/workflows/wheel.yml
    with:
      runner: ${{ matrix.runner }}
      arch: ${{ matrix.arch }}
      build: ${{ matrix.build }}
      expected-bits: ${{ matrix.bits }}
      artifact-name: ${{ matrix.artifact }}
      vcpkg-triplet: ${{ matrix.vcpkg-triplet }}

  publish:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: wheels
    runs-on: ubuntu-latest
    steps:
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish package
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}

  release-assets:
    name: Add wheels to GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
