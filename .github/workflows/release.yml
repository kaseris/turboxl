name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate-tag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Validate immutable release input
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python tools/ci/validate_release.py "$RELEASE_TAG"
  native:
    needs: validate-tag
    uses: ./.github/workflows/native.yml
  distributions:
    needs: validate-tag
    uses: ./.github/workflows/wheel.yml
  publish:
    name: Publish to PyPI
    needs: [native, distributions]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/turboxl
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: dist
      - run: python -m pip install -c tools/ci/constraints.txt packaging
      - run: python tools/ci/validate_dist.py dist
      - name: Verify existing PyPI files before resuming a partial upload
        id: pending
        run: python tools/ci/prepare_publish.py dist pending
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        if: steps.pending.outputs.count != '0'
        with:
          packages-dir: pending/
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
  github-release:
    name: Publish GitHub Release
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: dist
      - name: Create release and attach the tested files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes --draft
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false
