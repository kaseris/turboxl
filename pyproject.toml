[build-system]
requires = ["scikit-build-core>=0.11.6", "nanobind>=2.4"]
build-backend = "scikit_build_core.build"

[project]
name = "turboxl"
dynamic = ["version"]
description = "Fast XLSX to CSV converter (C++ core with Python bindings)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Michail Kaseris", email = "mich.kaseris@gmail.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: C++",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup :: XML",
    "Topic :: Office/Business :: Financial :: Spreadsheet",
]

keywords = ["xlsx", "csv", "excel", "converter", "fast", "c++"]

dependencies = []

[project.optional-dependencies]
pandas = ["pandas>=2.2,<3.1"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "isort>=5.0",
    "mypy>=1.0",
]

[tool.scikit-build]
wheel.py-api = "cp312"
install.components = ["python"]
sdist.include = ["src/python/turboxl/*.py", "tools/ci/*.py", "tools/ci/*.txt", "tools/ci/*.sh", "tools/ci/*.ps1", "tools/wheels/*.py", "tools/generate_benchmark_fixture.py", "tools/benchmark_parity.py", "tools/benchmark_typed.py", "tools/benchmark_pandas.py", "tools/azure_benchmark_once.sh", "tools/cloud_benchmark.py", "benchmarks/main.cpp", "benchmarks/turboxl-large-benchmark.xlsx", "benchmarks/results/**", "benchmarks/corpus/*.json", "benchmarks/corpus/*.md", "tests/**", "cmake/**"]
sdist.exclude = ["build*/**", "out/**", "dist/**", "benchmarks/corpus/files/**", "**/__pycache__/**", "**/*.pyc"]
cmake.build-type = "Release"
cmake.define = { BUILD_PYTHON = "ON", BUILD_TESTS = "OFF", BUILD_CLI = "OFF", BUILD_BENCHMARKS = "OFF", TURBOXL_PORTABLE_BUILD = "ON", TURBOXL_ENABLE_NATIVE_OPTIMIZATION = "OFF", TURBOXL_ENABLE_IPO = "ON" }

# Keep wheel policy here so local and CI builds use the same settings. The
# workflows only choose the exact interpreter/platform identifiers to build.
[tool.cibuildwheel]
build = ["cp310-*", "cp311-*", "cp312-*", "cp313-*", "cp314-*"]
skip = ["pp*", "*-musllinux_*"]
build-frontend = "uv"
test-command = "python {package}/tools/wheels/smoke_test.py 64"
dependency-versions = "./tools/ci/constraints.txt"

[tool.cibuildwheel.linux]
test-command = "python {package}/tools/wheels/smoke_test.py 64 && ccache --show-stats > /host/tmp/turboxl-ccache/statistics.txt"
manylinux-x86_64-image = "manylinux_2_28"
before-all = "bash {package}/tools/ci/install_deps.sh"

[tool.cibuildwheel.linux.environment]
CMAKE_BUILD_PARALLEL_LEVEL = "4"
CMAKE_CXX_COMPILER_LAUNCHER = "ccache"
CCACHE_DIR = "/host/tmp/turboxl-ccache"
CCACHE_MAXSIZE = "1G"
CCACHE_BASEDIR = "/project"
CCACHE_COMPILERCHECK = "content"
CMAKE_ARGS = "-DTURBOXL_PORTABLE_BUILD=ON -DTURBOXL_ENABLE_NATIVE_OPTIMIZATION=OFF"

[tool.cibuildwheel.macos]
before-all = "bash {package}/tools/ci/install_deps.sh"

[tool.cibuildwheel.macos.environment]
CMAKE_BUILD_PARALLEL_LEVEL = "4"
CMAKE_CXX_COMPILER_LAUNCHER = "ccache"
CCACHE_DIR = "/tmp/turboxl-ccache"
CCACHE_MAXSIZE = "1G"
CCACHE_BASEDIR = "$(pwd)"
CCACHE_COMPILERCHECK = "content"
MACOSX_DEPLOYMENT_TARGET = "15.0"
PKG_CONFIG_PATH = "/opt/homebrew/opt/libxml2/lib/pkgconfig:/opt/homebrew/opt/minizip-ng/lib/pkgconfig:/opt/homebrew/opt/zlib-ng/lib/pkgconfig:/usr/local/opt/libxml2/lib/pkgconfig:/usr/local/opt/minizip-ng/lib/pkgconfig:/usr/local/opt/zlib-ng/lib/pkgconfig"
CMAKE_PREFIX_PATH = "/opt/homebrew/opt/libxml2:/opt/homebrew/opt/minizip-ng:/opt/homebrew/opt/zlib-ng:/usr/local/opt/libxml2:/usr/local/opt/minizip-ng:/usr/local/opt/zlib-ng"
CMAKE_ARGS = "-DTURBOXL_PORTABLE_BUILD=ON -DTURBOXL_ENABLE_NATIVE_OPTIMIZATION=OFF"

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "CMakeLists.txt"
regex = '^project\(turboxl VERSION (?P<value>[0-9]+\.[0-9]+\.[0-9]+) LANGUAGES CXX\)$'

[tool.black]
line-length = 88
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
